<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulation caisses automatiques</title>
<style>
  :root {
    --auchan-red: #E0001A;
    --auchan-green: #009B4D;
    --dark-bg: rgba(15, 23, 42, 0.85);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
  #hud { position: absolute; top: 16px; left: 16px; color: #f8fafc; background: var(--dark-bg); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 10px; border-left: 4px solid var(--auchan-red); box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 13px; line-height: 1.6; pointer-events: none; white-space: pre; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(5px); cursor: pointer; font-size: 20px; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
  #control-panel { position: absolute; top: 16px; right: 16px; width: 280px; background: var(--dark-bg); backdrop-filter: blur(8px); color: #f8fafc; padding: 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); transition: transform 0.25s ease, opacity 0.25s ease; }
  #control-panel.hidden { transform: translateX(320px); opacity: 0; pointer-events: none; }
  #control-panel h3 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  .ctrl-group { margin-bottom: 12px; }
  .ctrl-group label { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 500; }
  .ctrl-group input[type=range] { width: 100%; accent-color: var(--auchan-red); cursor: pointer; }
  .btn-row { display: flex; gap: 6px; margin-top: 8px; }
  #control-panel button { flex: 1; background: #334155; color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.15s; }
  #control-panel button:hover { background: #475569; }
  #control-panel button.active { background: var(--auchan-red); }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud"></div>

<div id="control-panel" class="hidden">
  <h3>Paramètres simulation (P)</h3>
  <div class="ctrl-group">
    <label><span>Intervalle arrivées</span><span id="val-spawn">10 s</span></label>
    <input type="range" id="inp-spawn" min="2" max="30" value="10">
  </div>
  <div class="ctrl-group">
    <label><span>Vitesse de marche joueur</span><span id="val-walk">3.0</span></label>
    <input type="range" id="inp-walk" min="1" max="6" step="0.5" value="3">
  </div>
  <div class="ctrl-group">
    <label><span>Durée caisse min</span><span id="val-smin">120 s</span></label>
    <input type="range" id="inp-smin" min="30" max="300" step="10" value="120">
  </div>
  <div class="ctrl-group">
    <label><span>Durée caisse max</span><span id="val-smax">180 s</span></label>
    <input type="range" id="inp-smax" min="30" max="300" step="10" value="180">
  </div>
  <div class="ctrl-group">
    <label><span>Vitesse simulation</span><span id="val-speed">x1</span></label>
    <div class="btn-row">
      <button class="speed-btn active" data-speed="1">x1</button>
      <button class="speed-btn" data-speed="2">x2</button>
      <button class="speed-btn" data-speed="5">x5</button>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-reset">Réinitialiser</button>
  </div>
</div>

<div id="start">Cliquer pour commencer<br><small>ZQSD (ou WASD) : marcher · souris : regarder · E : occuper / libérer la caisse proche · H : demander de l'aide · P : paramètres · Échap : pause</small></div>

<script type="module">
import * as THREE from 'three';

const CONFIG = {
  WALK_SPEED: 3,
  SERVICE_MIN_S: 120,     // durée d'utilisation d'une caisse (hypothèse)
  SERVICE_MAX_S: 180,
  SPAWN_INTERVAL_S: 10,   // une nouvelle personne toutes les 10 s
  INITIAL_OCCUPIED: 0.95,
  TIME_SCALE: 1,
};

const AISLE_X = [-4.7, 1.8];
const ROW_Z = [-1.4, -3.6, -5.8, -8.0];
const COL_OFFSET = 1.7;
const BARRIER_Z = 1.0;
const PATH_Z = BARRIER_Z - 0.3;
const WINDOW_MS = 60000;

// Géométrie de la vraie file d'attente
const QUEUE_X = 0;
const QUEUE_HALF = 0.5;      // demi-largeur du couloir de file (relié à la barrière)
const GATE_HALF = QUEUE_HALF;
const QUEUE_FRONT_Z = 2.0;    // ligne d'attente en tête de file
const QUEUE_BACK_Z = 9.2;     // entrée arrière du couloir de file
const QUEUE_SPAWN = { x: QUEUE_X, z: QUEUE_BACK_Z + 2.5 };

const EXIT_Z = -9.1;
const EXIT_HALF = 3.4;
const PLAYER_R = 0.24;
const START_POS = { x: QUEUE_X, z: 9.9 }; // juste à l'entrée arrière de la file

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe2e8f0);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(5, 10, 5);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0xcbd5e1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.z = 1.5;
scene.add(floor);

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  return new THREE.CanvasTexture(c);
}

// Marquage au sol du couloir de file
const queueLaneMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(QUEUE_HALF * 2 - 0.08, QUEUE_BACK_Z - BARRIER_Z),
  new THREE.MeshStandardMaterial({ color: 0x334155 })
);
queueLaneMesh.rotation.x = -Math.PI / 2;
queueLaneMesh.position.set(QUEUE_X, 0.005, (BARRIER_Z + QUEUE_BACK_Z) / 2);
scene.add(queueLaneMesh);

const waitLineTex = canvasTexture(256, 64, (g, w, h) => {
  g.fillStyle = '#E0001A';
  g.fillRect(0, 0, w, 14);
  g.fillStyle = '#ffffff';
  g.font = 'bold 24px Arial';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('ATTENDEZ ICI', w / 2, 42);
});
const waitLine = new THREE.Mesh(
  new THREE.PlaneGeometry(QUEUE_HALF * 1.85, 0.38),
  new THREE.MeshBasicMaterial({ map: waitLineTex, transparent: true })
);
waitLine.rotation.x = -Math.PI / 2;
waitLine.position.set(QUEUE_X, 0.008, QUEUE_FRONT_Z - 0.35);
scene.add(waitLine);

const entrySignTex = canvasTexture(256, 64, (g, w, h) => {
  g.fillStyle = '#E0001A';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffffff';
  g.font = 'bold 28px Arial';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('↑ ENTRÉE FILE ↑', w / 2, h / 2);
});
const entrySign = new THREE.Mesh(
  new THREE.PlaneGeometry(QUEUE_HALF * 1.9, 0.45),
  new THREE.MeshBasicMaterial({ map: entrySignTex })
);
entrySign.rotation.x = -Math.PI / 2;
entrySign.position.set(QUEUE_X, 0.008, QUEUE_BACK_Z + 0.32);
scene.add(entrySign);

function ledTexture(bg, text, fg) {
  return canvasTexture(128, 128, g => {
    g.fillStyle = bg;
    g.fillRect(0, 0, 128, 128);
    g.fillStyle = fg;
    g.font = 'bold 30px Arial';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, 64, 64);
  });
}

const LED_TEX = {
  free: ledTexture('#009B4D', 'LIBRE', '#ffffff'),
  help: ledTexture('#FFB300', 'AIDE', '#000000'),
  off: ledTexture('#1e293b', '', '#000000'),
};

const ARROW_SPACING = 0.7;
const ARROW_ON = new THREE.Color(0x009b4d);
const ARROW_OFF = new THREE.Color(0x334155);
const ARROW_GEO = (() => {
  const s = new THREE.Shape();
  s.moveTo(0, 0.12);
  s.lineTo(0.18, -0.06);
  s.lineTo(0.18, -0.16);
  s.lineTo(0, 0.02);
  s.lineTo(-0.18, -0.16);
  s.lineTo(-0.18, -0.06);
  s.closePath();
  const g = new THREE.ShapeGeometry(s);
  g.rotateX(Math.PI / 2);
  return g;
})();

const arrowAt = new Map();

function arrowRecord(x, z, ang) {
  const key = `${x.toFixed(2)},${z.toFixed(2)},${ang.toFixed(2)}`;
  if (!arrowAt.has(key)) {
    const mat = new THREE.MeshBasicMaterial({
      color: ARROW_OFF,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -1,
    });
    const mesh = new THREE.Mesh(ARROW_GEO, mat);
    mesh.position.set(x, 0.012, z);
    mesh.rotation.y = ang;
    scene.add(mesh);
    arrowAt.set(key, { mat, mesh, entries: [] });
  }
  return arrowAt.get(key);
}

function makeLane(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z));
  }
  const total = cum[cum.length - 1];
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    segs.push({ ax: pts[i].x, az: pts[i].z, bx: pts[i + 1].x, bz: pts[i + 1].z, f0: cum[i], f1: cum[i + 1] });
  }
  const lane = { segs, progress: 0, free: true };
  const spots = [];
  for (let s = 0.35; s <= total - 0.6; s += ARROW_SPACING) spots.push(s);
  spots.push(total - 0.12);
  for (const s of spots) {
    const seg = segs.find(g => s <= g.f1) || segs[segs.length - 1];
    const t = (s - seg.f0) / (seg.f1 - seg.f0);
    const dx = seg.bx - seg.ax;
    const dz = seg.bz - seg.az;
    arrowRecord(seg.ax + dx * t, seg.az + dz * t, Math.atan2(dx, dz)).entries.push({ s, lane });
  }
  return lane;
}

function updateArrows() {
  for (const rec of arrowAt.values()) {
    let visible = false;
    let lit = 0;
    for (const { s, lane } of rec.entries) {
      if (s >= lane.progress - 1.6) visible = true;
      if (lane.free) lit = Math.max(lit, clamp((s - lane.progress + 1.6) / 1.6, 0, 1));
    }
    rec.mesh.visible = visible;
    rec.mat.color.copy(ARROW_OFF).lerp(ARROW_ON, lit * lit * (3 - 2 * lit));
  }
}

const kiosks = [];

function buildKiosk(x, z, rotY) {
  const root = new THREE.Group();
  root.position.set(x, 0, z);
  root.rotation.y = rotY;

  const metal = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.4, roughness: 0.35 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
  const black = new THREE.MeshStandardMaterial({ color: 0x0f172a });
  const part = (w, h, d, mat, px, py, pz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(px, py, pz);
    root.add(m);
  };

  part(0.9, 0.95, 0.7, metal, 0, 0.475, 0);
  part(0.9, 0.04, 0.45, metal, 0, 0.97, 0.1);
  part(0.6, 0.85, 0.22, dark, 0, 1.375, -0.12);
  part(0.66, 0.05, 0.26, metal, 0, 1.8, -0.12);
  part(0.16, 0.06, 0.12, black, 0.2, 1.0, 0.3);
  part(0.1, 0.2, 0.02, black, 0.25, 1.3, 0.0);
  part(0.5, 0.03, 0.5, metal, 0.7, 0.92, 0.1);
  part(0.4, 0.03, 0.55, metal, -0.65, 0.92, 0.05);
  part(0.03, 0.5, 0.55, dark, -0.88, 1.17, 0.05);
  part(0.5, 0.4, 0.02, dark, -0.1, 0.35, 0.36);
  part(0.7, 0.04, 0.03, metal, 0, 0.1, 0.37);

  const screenMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8 });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.32), screenMat);
  screen.position.set(0, 1.42, 0.0);
  root.add(screen);

  const ledSide = new THREE.MeshBasicMaterial({ map: LED_TEX.off });
  const ledBlack = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), [ledSide, ledSide, ledBlack, ledBlack, ledSide, ledSide]);
  led.position.y = 2.3;
  root.add(led);
  part(0.06, 0.5, 0.06, dark, 0, 2.05, -0.12);
  scene.add(root);

  const fx = Math.sin(rotY);
  const fz = Math.cos(rotY);
  const stand = { x: x + fx * 1.15, z: z + fz * 1.15 };
  const spineX = Math.abs(stand.x - AISLE_X[0]) < Math.abs(stand.x - AISLE_X[1]) ? AISLE_X[0] : AISLE_X[1];
  const lanes = [makeLane([{ x: QUEUE_X, z: PATH_Z }, { x: spineX, z: PATH_Z }, { x: spineX, z }, { x: stand.x, z }])];
  const marker = new THREE.Mesh(
    new THREE.CircleGeometry(0.14, 24),
    new THREE.MeshBasicMaterial({ color: 0x009b4d, polygonOffset: true, polygonOffsetFactor: -1 }),
  );
  marker.rotation.x = -Math.PI / 2;
  marker.position.set(stand.x, 0.015, stand.z);
  scene.add(marker);

  kiosks.push({
    x, z, rotY,
    stand,
    occupied: false, claimed: false, manual: false, help: false,
    lanes, marker, ledSide, screenMat,
  });
}

for (const ax of AISLE_X) {
  for (const z of ROW_Z) {
    buildKiosk(ax - COL_OFFSET, z, Math.PI / 2);
    buildKiosk(ax + COL_OFFSET, z, -Math.PI / 2);
  }
}

const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.6, roughness: 0.3 });
const beltMat = new THREE.MeshStandardMaterial({ color: 0xE0001A });

function addStanchion(x, z) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 8), chromeMat);
  post.position.set(x, 0.5, z);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.04, 12), chromeMat);
  base.position.set(x, 0.02, z);
  scene.add(post, base);
}

// Barrières horizontales à BARRIER_Z (reliées aux bords du couloir de file)
for (const sgn of [-1, 1]) {
  const xs = [];
  for (let x = GATE_HALF; x <= 11; x += 1.5) xs.push(sgn * x);
  if (Math.abs(xs[xs.length - 1]) < 11) xs.push(sgn * 11);
  for (const x of xs) addStanchion(x, BARRIER_Z);
  for (let i = 0; i < xs.length - 1; i++) {
    const belt = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(xs[i + 1] - xs[i]), 0.08, 0.02), beltMat);
    belt.position.set((xs[i] + xs[i + 1]) / 2, 0.85, BARRIER_Z);
    scene.add(belt);
  }
}

// Poteaux et sangles latéraux matérialisant le couloir de file d'attente
for (const sgn of [-1, 1]) {
  const x = QUEUE_X + sgn * QUEUE_HALF;
  const zs = [];
  for (let z = BARRIER_Z; z <= QUEUE_BACK_Z; z += 1.64) zs.push(z);
  if (zs[zs.length - 1] < QUEUE_BACK_Z - 0.1) zs.push(QUEUE_BACK_Z);
  for (let i = 1; i < zs.length; i++) addStanchion(x, zs[i]);
  for (let i = 0; i < zs.length - 1; i++) {
    const belt = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, zs[i + 1] - zs[i]), beltMat);
    belt.position.set(x, 0.85, (zs[i] + zs[i + 1]) / 2);
    scene.add(belt);
  }
}

const redMat = new THREE.MeshStandardMaterial({ color: 0xE0001A });
const scannerMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
const exitSignTex = canvasTexture(256, 64, (g, w, h) => {
  g.fillStyle = '#009B4D';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffffff';
  g.font = 'bold 48px Arial';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('←', w / 2, h / 2);
});
for (const sgn of [-1, 1]) {
  for (const x of [3.4, 5.4, 7.4, 9.4]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 8), chromeMat);
    post.position.set(sgn * x, 0.55, EXIT_Z);
    scene.add(post);
  }
  for (const y of [0.4, 0.9]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(6, 0.04, 0.04), chromeMat);
    rail.position.set(sgn * 6.4, y, EXIT_Z);
    scene.add(rail);
  }
  const scanner = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.2), scannerMat);
  scanner.position.set(sgn * 3.4, 0.9, EXIT_Z);
  scene.add(scanner);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.05, 0.05), redMat);
  arm.position.set(sgn * 2.2, 1.0, EXIT_Z);
  scene.add(arm);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), new THREE.MeshBasicMaterial({ map: exitSignTex }));
  sign.position.set(sgn * 6.4, 1.5, EXIT_Z);
  scene.add(sign);
}

// Boîtes de collision solides (barrières, sangles de file, sorties, TV)
const WALLS = [
  { minX: -12, maxX: -GATE_HALF, minZ: BARRIER_Z - 0.06, maxZ: BARRIER_Z + 0.06 },
  { minX: GATE_HALF, maxX: 12, minZ: BARRIER_Z - 0.06, maxZ: BARRIER_Z + 0.06 },
  { minX: QUEUE_X - QUEUE_HALF - 0.05, maxX: QUEUE_X - QUEUE_HALF + 0.05, minZ: BARRIER_Z, maxZ: QUEUE_BACK_Z },
  { minX: QUEUE_X + QUEUE_HALF - 0.05, maxX: QUEUE_X + QUEUE_HALF + 0.05, minZ: BARRIER_Z, maxZ: QUEUE_BACK_Z },
  { minX: -12, maxX: -EXIT_HALF, minZ: EXIT_Z - 0.08, maxZ: EXIT_Z + 0.08 },
  { minX: EXIT_HALF, maxX: 12, minZ: EXIT_Z - 0.08, maxZ: EXIT_Z + 0.08 },
  { minX: -2.0, maxX: -1.8, minZ: 3.7, maxZ: 6.3 }, // pied/écran TV
];

function refresh(k) {
  const free = !k.occupied;
  for (const lane of k.lanes) lane.free = free;
  k.marker.visible = free;
  k.screenMat.color.set(free ? 0x00e676 : 0x3b82f6);
  k.screenMat.emissive.set(free ? 0x008a44 : 0x1d4ed8);
  k.ledSide.map = LED_TEX[k.help ? 'help' : (free ? 'free' : 'off')];
}

const freeCount = () => kiosks.filter(k => !k.occupied).length;

function resetLanes(k) {
  for (const lane of k.lanes) lane.progress = 0;
}

function setOccupied(k, value) {
  k.occupied = value;
  if (value) k.help = false;
  else resetLanes(k);
  kiosks.forEach(refresh);
}

function toggleManual(k) {
  if (k.manual) {
    k.manual = false;
    setOccupied(k, false);
  } else if (!k.occupied && !k.claimed) {
    k.manual = true;
    setOccupied(k, true);
  }
}

function nearestKiosk(maxDist = 3) {
  let best = null;
  let bestDist = maxDist;
  for (const k of kiosks) {
    const d = Math.hypot(camera.position.x - k.x, camera.position.z - k.z);
    if (d < bestDist) { bestDist = d; best = k; }
  }
  return best;
}

const KIOSK_HALF_W = 0.95;
const KIOSK_BACK = -0.35;
const KIOSK_FRONT = 0.39;
const collidesKiosk = (x, z) => kiosks.some(k => {
  const dx = x - k.x, dz = z - k.z;
  const c = Math.cos(k.rotY), s = Math.sin(k.rotY);
  const lx = dx * c - dz * s;
  const lz = dx * s + dz * c;
  return Math.abs(lx) < KIOSK_HALF_W + PLAYER_R && lz > KIOSK_BACK - PLAYER_R && lz < KIOSK_FRONT + PLAYER_R;
});
const hitsWall = (x, z) => WALLS.some(w =>
  x > w.minX - PLAYER_R && x < w.maxX + PLAYER_R &&
  z > w.minZ - PLAYER_R && z < w.maxZ + PLAYER_R
);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

const NPC_COLORS = [0x0284c7, 0x16a34a, 0xd97706, 0x9333ea, 0xdb2777, 0x475569];
const NPC_SEP = 0.5;
const npcs = [];
let spawnTimer = 0;
let simNow = 0;
const stats = { arrivals: [], finished: [], start: 0 };

const randBetween = (min, max) => min + Math.random() * (max - min);

function createNpcMesh() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.25, 1.2, 12),
    new THREE.MeshStandardMaterial({ color: NPC_COLORS[Math.floor(Math.random() * NPC_COLORS.length)] })
  );
  body.position.y = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), new THREE.MeshStandardMaterial({ color: 0xf1c27d }));
  head.position.y = 1.6;
  group.add(body, head);
  scene.add(group);
  return group;
}

function spawnNpc() {
  // Évite de faire apparaître un PNJ sur le joueur ou un autre PNJ
  if (Math.hypot(camera.position.x - QUEUE_SPAWN.x, camera.position.z - QUEUE_SPAWN.z) < 0.9) return false;
  if (npcs.some(n => Math.hypot(n.mesh.position.x - QUEUE_SPAWN.x, n.mesh.position.z - QUEUE_SPAWN.z) < 0.9)) return false;

  const group = createNpcMesh();
  group.position.set(QUEUE_SPAWN.x, 0, QUEUE_SPAWN.z);
  group.rotation.y = Math.PI;

  npcs.push({ mesh: group, state: 'enter', spotX: randBetween(-0.5, 0.5), kiosk: null, route: null, stage: 0, useLeft: 0, useTotal: 0, seeded: false });
  stats.arrivals.push(simNow);
  return true;
}

function seedOccupied() {
  for (const k of kiosks) {
    if (Math.random() >= CONFIG.INITIAL_OCCUPIED) continue;
    const group = createNpcMesh();
    group.position.set(k.stand.x, 0, k.stand.z);
    group.rotation.y = Math.atan2(k.x - k.stand.x, k.z - k.stand.z);
    const useTotal = randBetween(CONFIG.SERVICE_MIN_S, CONFIG.SERVICE_MAX_S);
    npcs.push({ mesh: group, state: 'using', kiosk: k, route: null, stage: 0, useLeft: useTotal * Math.random(), useTotal, seeded: true });
    setOccupied(k, true);
  }
  const seededUsing = npcs.filter(n => n.state === 'using' && n.seeded);
  if (seededUsing.length) {
    const first = seededUsing.reduce((a, b) => (a.useLeft < b.useLeft ? a : b));
    first.useLeft = Math.min(first.useLeft, randBetween(4, 6));
  }
}

function moveToward(mesh, tx, tz, maxStep) {
  const dx = tx - mesh.position.x;
  const dz = tz - mesh.position.z;
  const d = Math.hypot(dx, dz);
  if (d <= maxStep) {
    mesh.position.x = tx;
    mesh.position.z = tz;
    return true;
  }
  mesh.position.x += (dx / d) * maxStep;
  mesh.position.z += (dz / d) * maxStep;
  mesh.rotation.y = Math.atan2(dx, dz);
  return false;
}

function dispatchWaiting(npc) {
  const freeKiosks = kiosks.filter(k => !k.occupied && !k.claimed);
  if (!freeKiosks.length) return;
  const distFromMouth = k => Math.hypot(k.stand.x - QUEUE_X, k.stand.z - PATH_Z);
  const free = freeKiosks.reduce((a, b) => (distFromMouth(b) < distFromMouth(a) ? b : a));
  npc.state = 'walk';
  npc.kiosk = free;
  npc.route = [{ x: free.stand.x, z: PATH_Z }, free.stand];
  npc.stage = 0;
  free.claimed = true;
}

function updateNpcs(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) spawnTimer = spawnNpc() ? CONFIG.SPAWN_INTERVAL_S : 0.5;

  for (const npc of npcs) {
    if (npc.state === 'enter') {
      if (stepNpc(npc, npc.spotX, PATH_Z, 1.35 * dt)) npc.state = 'wait';
    } else if (npc.state === 'wait') {
      dispatchWaiting(npc);
    }
  }

  // 4. Parcours vers caisse, utilisation et sortie par les portillons du fond (EXIT_Z)
  for (let i = npcs.length - 1; i >= 0; i--) {
    const npc = npcs[i];
    const k = npc.kiosk;
    if (npc.state === 'walk') {
      const wp = npc.route[npc.stage];
      if (moveToward(npc.mesh, wp.x, wp.z, 1.45 * dt)) npc.stage++;
      for (const lane of k.lanes) advanceLane(lane, npc.mesh.position);
      if (npc.stage === npc.route.length) {
        npc.state = 'using';
        npc.mesh.rotation.y = Math.atan2(k.x - k.stand.x, k.z - k.stand.z);
        npc.useTotal = randBetween(CONFIG.SERVICE_MIN_S, CONFIG.SERVICE_MAX_S);
        npc.useLeft = npc.useTotal;
        setOccupied(k, true);
      }
    } else if (npc.state === 'using') {
      npc.useLeft -= dt;
      if (npc.useLeft <= 0) {
        k.claimed = false;
        setOccupied(k, false);
        if (!npc.seeded) stats.finished.push(simNow);
        const aisleX = Math.abs(k.stand.x - AISLE_X[0]) < Math.abs(k.stand.x - AISLE_X[1]) ? AISLE_X[0] : AISLE_X[1];
        npc.route = [
          { x: aisleX, z: k.stand.z },
          { x: aisleX, z: EXIT_Z + 0.6 },
          { x: clamp(aisleX, -0.6, 0.6), z: EXIT_Z + 0.5 },
          { x: clamp(aisleX, -0.6, 0.6), z: EXIT_Z - 1.5 },
        ];
        npc.stage = 0;
        npc.state = 'exit';
      }
    } else if (npc.state === 'exit') {
      const wp = npc.route[npc.stage];
      if (moveToward(npc.mesh, wp.x, wp.z, 1.45 * dt)) npc.stage++;
      if (npc.stage === npc.route.length) {
        scene.remove(npc.mesh);
        npcs.splice(i, 1);
      }
    }
  }
}

function predict(now) {
  const inWindow = arr => {
    const recent = arr.filter(t => now - t <= WINDOW_MS);
    arr.length = 0;
    arr.push(...recent);
    return recent.length;
  };
  const windowMin = Math.max(Math.min((now - stats.start) / 60000, 1), 0.5);
  return {
    arrivalsPerMin: inWindow(stats.arrivals) / windowMin,
    throughputPerMin: inWindow(stats.finished) / windowMin,
  };
}

const boardCanvas = document.createElement('canvas');
boardCanvas.width = 1280;
boardCanvas.height = 720;
const boardCtx = boardCanvas.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardCanvas);
const tv = new THREE.Group();
tv.position.set(-1.9, 0, 5.0);
tv.rotation.y = Math.PI / 2;
const bezel = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 0.08), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
bezel.position.y = 1.4;
const screenFace = new THREE.Mesh(new THREE.PlaneGeometry(2.36, 1.36), new THREE.MeshBasicMaterial({ map: boardTex }));
screenFace.position.set(0, 1.4, 0.045);
const pole = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.08), new THREE.MeshStandardMaterial({ color: 0x222222 }));
pole.position.y = 0.35;
const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
base.position.y = 0.02;
tv.add(bezel, screenFace, pole, base);
scene.add(tv);

let boardKey = '';
function updateBoard(now) {
  const n = freeCount();
  const p = predict(now);
  const flow = `Débit ${p.throughputPerMin.toFixed(1)}/min · Arrivées ${p.arrivalsPerMin.toFixed(1)}/min`;
  const key = `${n}|${flow}`;
  if (key === boardKey) return;
  boardKey = key;
  const g = boardCtx;
  g.fillStyle = '#0f172a';
  g.fillRect(0, 0, 1280, 720);
  g.fillStyle = '#E0001A';
  g.fillRect(0, 0, 1280, 110);
  g.fillStyle = '#ffffff';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  g.font = 'bold 50px Arial';
  g.fillText('Caisses libre-service', 50, 55);
  g.fillStyle = n > 0 ? '#00e676' : '#ff5252';
  g.font = 'bold 200px Arial';
  g.fillText(String(n), 50, 330);
  g.fillStyle = '#ffffff';
  g.font = 'bold 60px Arial';
  g.fillText(`caisse${n > 1 ? 's' : ''} libre${n > 1 ? 's' : ''}`, 330, 330);
  g.font = '40px Arial';
  g.fillText(flow, 50, 500);
  boardTex.needsUpdate = true;
}

function advanceLane(lane, pos) {
  const { f, d } = laneProject(pos.x, pos.z, lane);
  if (d < 0.35) lane.progress = Math.max(lane.progress, f);
}

function laneProject(px, pz, lane) {
  let best = { f: 0, d: Infinity };
  for (const s of lane.segs) {
    const dx = s.bx - s.ax;
    const dz = s.bz - s.az;
    const t = clamp(((px - s.ax) * dx + (pz - s.az) * dz) / (dx * dx + dz * dz), 0, 1);
    const d = Math.hypot(px - (s.ax + dx * t), pz - (s.az + dz * t));
    if (d < best.d) best = { f: s.f0 + (s.f1 - s.f0) * t, d };
  }
  return best;
}

function hitsNpc(x, z, x0, z0) {
  for (const npc of npcs) {
    const nx = npc.mesh.position.x;
    const nz = npc.mesh.position.z;
    const dNew = Math.hypot(x - nx, z - nz);
    const dOld = Math.hypot(x0 - nx, z0 - nz);
    if (dNew < 0.56 && dNew < dOld) return true;
  }
  return false;
}

function hitsPlayer(x, z, x0, z0) {
  if (camera.position.z < BARRIER_Z) return false;
  const dNew = Math.hypot(x - camera.position.x, z - camera.position.z);
  const dOld = Math.hypot(x0 - camera.position.x, z0 - camera.position.z);
  return dNew < 0.56 && dNew < dOld;
}

function npcBlocked(x, z, x0, z0, self) {
  if (hitsPlayer(x, z, x0, z0)) return true;
  if (Math.min(z0, z) >= BARRIER_Z && hitsWall(x, z)) return true;
  return npcs.some(o => {
    if (o === self || (o.state !== 'enter' && o.state !== 'wait')) return false;
    const ox = o.mesh.position.x;
    const oz = o.mesh.position.z;
    const dNew = Math.hypot(x - ox, z - oz);
    return dNew < NPC_SEP && dNew < Math.hypot(x0 - ox, z0 - oz);
  });
}

function stepNpc(npc, tx, tz, maxStep) {
  const p = npc.mesh.position;
  const x0 = p.x;
  const z0 = p.z;
  const dx = tx - x0;
  const dz = tz - z0;
  const d = Math.hypot(dx, dz);
  if (d < 1e-4) return true;
  const s = Math.min(d, maxStep);
  const nx = x0 + (dx / d) * s;
  const nz = z0 + (dz / d) * s;
  if (!npcBlocked(nx, nz, x0, z0, npc)) {
    p.x = nx;
    p.z = nz;
  } else if (!npcBlocked(nx, z0, x0, z0, npc)) {
    p.x = nx;
  } else if (!npcBlocked(x0, nz, x0, z0, npc)) {
    p.z = nz;
  } else {
    return false;
  }
  npc.mesh.rotation.y = Math.atan2(dx, dz);
  return Math.hypot(tx - p.x, tz - p.z) < 1e-4;
}

const keys = {};
let yaw = 0;
let pitch = 0;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyE') {
    const k = nearestKiosk();
    if (k) toggleManual(k);
  }
  if (e.code === 'KeyH') {
    const k = nearestKiosk();
    if (k) k.help = !k.help;
  }
  if (e.code === 'KeyP') {
    panelEl.classList.toggle('hidden');
    if (!panelEl.classList.contains('hidden') && document.pointerLockElement) document.exitPointerLock();
    syncStart();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const code in keys) keys[code] = false; });

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.002;
  pitch = clamp(pitch - e.movementY * 0.002, -1.3, 1.3);
});

const startEl = document.getElementById('start');
startEl.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', syncStart);

const panelEl = document.getElementById('control-panel');
const $ = id => document.getElementById(id);
const setLabel = (id, text) => { $(id).textContent = text; };

function syncStart() {
  const panelOpen = !panelEl.classList.contains('hidden');
  startEl.style.display = document.pointerLockElement || panelOpen ? 'none' : 'flex';
}

$('inp-spawn').addEventListener('input', e => {
  CONFIG.SPAWN_INTERVAL_S = Number(e.target.value);
  setLabel('val-spawn', `${CONFIG.SPAWN_INTERVAL_S} s`);
});
$('inp-walk').addEventListener('input', e => {
  CONFIG.WALK_SPEED = Number(e.target.value);
  setLabel('val-walk', CONFIG.WALK_SPEED.toFixed(1));
});
$('inp-smin').addEventListener('input', e => {
  CONFIG.SERVICE_MIN_S = Number(e.target.value);
  if (CONFIG.SERVICE_MIN_S > CONFIG.SERVICE_MAX_S) {
    CONFIG.SERVICE_MAX_S = CONFIG.SERVICE_MIN_S;
    $('inp-smax').value = CONFIG.SERVICE_MAX_S;
    setLabel('val-smax', `${CONFIG.SERVICE_MAX_S} s`);
  }
  setLabel('val-smin', `${CONFIG.SERVICE_MIN_S} s`);
});
$('inp-smax').addEventListener('input', e => {
  CONFIG.SERVICE_MAX_S = Number(e.target.value);
  if (CONFIG.SERVICE_MAX_S < CONFIG.SERVICE_MIN_S) {
    CONFIG.SERVICE_MIN_S = CONFIG.SERVICE_MAX_S;
    $('inp-smin').value = CONFIG.SERVICE_MIN_S;
    setLabel('val-smin', `${CONFIG.SERVICE_MIN_S} s`);
  }
  setLabel('val-smax', `${CONFIG.SERVICE_MAX_S} s`);
});
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    CONFIG.TIME_SCALE = Number(btn.dataset.speed);
    setLabel('val-speed', `x${CONFIG.TIME_SCALE}`);
  });
});
$('btn-reset').addEventListener('click', resetSim);

const hud = document.getElementById('hud');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function resetSim() {
  for (const npc of npcs) scene.remove(npc.mesh);
  npcs.length = 0;
  spawnTimer = 1.5;
  stats.arrivals.length = 0;
  stats.finished.length = 0;
  stats.start = simNow;
  for (const k of kiosks) {
    k.occupied = false;
    k.claimed = false;
    k.manual = false;
    k.help = false;
    resetLanes(k);
  }
  kiosks.forEach(refresh);
  seedOccupied();
  camera.position.set(START_POS.x, 1.6, START_POS.z);
  yaw = 0;
  pitch = 0;
}

let last = performance.now();

function frame(now) {
  const rawDt = Math.min((now - last) / 1000, 0.05);
  const dt = rawDt * CONFIG.TIME_SCALE;
  last = now;
  simNow += dt * 1000;

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  let mx = 0, mz = 0;
  if (keys.KeyW) mz -= 1;
  if (keys.KeyS) mz += 1;
  if (keys.KeyA) mx -= 1;
  if (keys.KeyD) mx += 1;

  if (mx || mz) {
    const len = Math.hypot(mx, mz);
    mx /= len; mz /= len;
    const dx = -Math.sin(yaw) * (-mz) + Math.cos(yaw) * mx;
    const dz = -Math.cos(yaw) * (-mz) - Math.sin(yaw) * mx;
    const step = CONFIG.WALK_SPEED * rawDt;

    const x0 = camera.position.x;
    const z0 = camera.position.z;
    let nx = clamp(x0 + dx * step, -11, 11);
    let nz = clamp(z0 + dz * step, -9.6, 12.0);

    const inStore = Math.min(z0, nz) < BARRIER_Z;
    const solid = (x, z, px, pz) => collidesKiosk(x, z) || (!inStore && (hitsWall(x, z) || hitsNpc(x, z, px, pz)));

    if (!solid(nx, z0, x0, z0)) {
      camera.position.x = nx;
    }

    const x1 = camera.position.x;
    if (!solid(x1, nz, x1, z0)) {
      camera.position.z = nz;
    }
  }

  if (camera.position.z < EXIT_Z) resetSim();

  for (const k of kiosks) {
    for (const lane of k.lanes) {
      const { f, d } = laneProject(camera.position.x, camera.position.z, lane);
      if (d < 0.35) lane.progress = Math.max(lane.progress, f);
    }
  }

  updateNpcs(dt);

  for (const k of kiosks) refresh(k);
  updateArrows();

  updateBoard(simNow);

  const p = predict(simNow);
  hud.textContent =
    `Débit ${p.throughputPerMin.toFixed(1)}/min  ·  Arrivées ${p.arrivalsPerMin.toFixed(1)}/min\n` +
    `ZQSD marcher · souris regarder · E occuper/libérer · H aide`;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resetSim();
requestAnimationFrame(frame);
</script>
